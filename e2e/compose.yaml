# Run with `go run -tags task ./tasks/e2e` from the repo root.
name: ollama-tray-go-e2e

services:
  ollama:
    image: ollama/ollama:0.40.8@sha256:2b8eecdb85aa6ea67c381c8ecffec04b2658496cf2821a8f88b0485bdff198e8
    volumes:
      # Keeps the pulled model between local runs.
      - models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 2s
      timeout: 5s
      retries: 30

  tray:
    # The test starts the tray as a child process. An init reaps it if the test exits first.
    init: true
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_URL: http://ollama:11434
      E2E_MODEL: smollm2:135m

volumes:
  models:
