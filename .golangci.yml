version: "2"
run:
  build-tags:
    - task
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - revive
    - gosec
    - bodyclose
    - contextcheck
    - testifylint
    - exhaustive
formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
