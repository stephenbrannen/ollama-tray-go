version: 2

# Each release runner builds only its own OS, because the macOS build needs
# cgo for the Cocoa tray. The release workflow then merges both sets.
builds:
  - id: linux
    main: ./cmd/ollama-tray
    binary: ollama-tray
    goos: [linux]
    goarch: [amd64, arm64]
    skip: '{{ ne .Runtime.Goos "linux" }}'
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w -X github.com/stephenbrannen/ollama-tray-go/internal/version.Version={{.Version}}
  - id: darwin
    main: ./cmd/ollama-tray
    binary: ollama-tray
    goos: [darwin]
    goarch: [amd64, arm64]
    skip: '{{ ne .Runtime.Goos "darwin" }}'
    env:
      # fyne.io/systray talks to Cocoa through cgo.
      - CGO_ENABLED=1
      # Without a minimum, the C toolchain stamps the runner's own macOS version
      # into the binary, and older Macs refuse to start it. macOS 13 is the
      # oldest version that recent Go runtimes target. The flags, unlike
      # MACOSX_DEPLOYMENT_TARGET, are part of Go's build cache key.
      - CGO_CFLAGS=-O2 -g -mmacosx-version-min=13.0
      - CGO_LDFLAGS=-O2 -g -mmacosx-version-min=13.0
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w -X github.com/stephenbrannen/ollama-tray-go/internal/version.Version={{.Version}}

archives:
  - id: linux
    ids: [linux]
    formats: [tar.gz]
    # Pin the file times so the archive bytes do not depend on checkout time.
    builds_info:
      mtime: '{{ .CommitDate }}'
    files:
      - src: README.md
        info:
          mtime: '{{ .CommitDate }}'
      - src: LICENSE
        info:
          mtime: '{{ .CommitDate }}'
      - src: ollama-tray.desktop
        info:
          mtime: '{{ .CommitDate }}'
  # The desktop entry is a Linux autostart file, so macOS archives leave it out.
  - id: darwin
    ids: [darwin]
    formats: [tar.gz]
    builds_info:
      mtime: '{{ .CommitDate }}'
    files:
      - src: README.md
        info:
          mtime: '{{ .CommitDate }}'
      - src: LICENSE
        info:
          mtime: '{{ .CommitDate }}'

checksum:
  name_template: checksums.txt

changelog:
  use: github
  # The release notes come from the Linux build, so macOS skips the API call.
  disable: '{{ ne .Runtime.Goos "linux" }}'
