version: 2

builds:
  - main: ./cmd/ollama-tray
    binary: ollama-tray
    goos: [linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/stephenbrannen/ollama-tray-go/internal/version.Version={{.Version}}

archives:
  - formats: [tar.gz]
    files:
      - README.md
      - ollama-tray.desktop

checksum:
  name_template: checksums.txt

changelog:
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
