name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The macOS build needs cgo for the Cocoa tray, so each OS builds on its own
  # runner. Neither build job can write to the repository.
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A tag can point at a commit that never went through review on main.
      # Stop before anything is built for the release.
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A cache another workflow can write would feed the release build.
          cache: false
      # Each runner tests its own OS, because the tray code differs per OS.
      - name: Vet and test
        run: |
          go vet ./...
          go test -race -count=1 ./...
      # GoReleaser builds only this runner's OS (see `skip` in
      # .goreleaser.yaml). The release job publishes, so this job never does.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --skip=publish
        env:
          # The Linux build reads commits for the changelog. The token is
          # read-only in this job.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/CHANGELOG.md
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # One checksums file covers every archive from both runners.
      - name: Write checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > checksums.txt
      # Artifact attestations need a public repository (or an Enterprise plan).
      # On a private repository the step would fail, so it is skipped there.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
      # --verify-tag refuses to create a tag, so the release can only use the
      # tag that started this run.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" dist/*.tar.gz dist/checksums.txt
          --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG"
          --notes-file dist/CHANGELOG.md

  # A separate job keeps the cache token away from the release job's write
  # token, and gives it read-only permissions.
  cache:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ollama-tray
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build
