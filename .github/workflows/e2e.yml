name: e2e

on:
  push:
    branches: [main]
  # Every pull request runs it, so the ruleset can require it.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older run stale. Runs on main always finish.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    # Linux only: the test fakes the D-Bus tray host that Linux panels use.
    # macOS draws the tray through Cocoa, which has no such host to fake.
    runs-on: ubuntu-latest
    # Each run pulls the Ollama image and the model (about 270 MB), then builds the test image.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The task only runs docker. The image build downloads the modules it needs.
          cache: false
      - run: go run -tags task ./tasks/e2e
