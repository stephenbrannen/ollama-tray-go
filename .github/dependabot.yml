version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release pulled within a day or two never reaches a bump PR.
    cooldown:
      default-days: 2
  # A gomod bump changes go.sum, so nix build fails until vendorHash in
  # flake.nix is updated. The README's Development section has the steps.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
  # The end-to-end test pins its images by tag and digest.
  - package-ecosystem: docker
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    ignore:
      # The e2e image must build with the toolchain go.mod pins, so it tests the
      # compiler users get. Moving to a new Go minor is a deliberate project change.
      - dependency-name: golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: docker-compose
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
