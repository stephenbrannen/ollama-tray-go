repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: sh -c 'test -z "$(gofmt -s -l .)" || { gofmt -s -l .; exit 1; }'
        language: system
        types: [go]
        pass_filenames: false
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run ./...
        language: system
        types: [go]
        pass_filenames: false
